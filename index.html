<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Navegadores do Destino</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TELA INICIAL -->
  <div id="start-screen" class="overlay">
    <div class="modal-card title-card">
      <h1 class="game-title">⛵ Navegadores do Destino</h1>
      <p class="subtitle">Expedição Histórica & RPG Marítimo</p>
      <div class="menu-actions">
        <button id="btn-start-new" class="btn btn-amber btn-lg">Iniciar Nova Expedição</button>
        <button id="btn-continue" class="btn btn-slate btn-lg hidden">Continuar Viagem</button>
      </div>
    </div>
  </div>

  <!-- HUD SUPERIOR (INTERFACE DO JOGO) -->
  <header id="hud">
    <div class="hud-item"><span class="label">CAPITÃO:</span> <strong id="player-title">Grumete</strong></div>
    <div class="hud-item"><span class="label">DUCADOS:</span> <strong id="player-ducats">150</strong> 𐫱</div>
    <div class="hud-item"><span class="label">PRESTÍGIO (XP):</span> <strong id="player-xp">0</strong></div>
    <div class="hud-actions">
      <button id="btn-open-shop" class="btn btn-amber btn-sm">🛒 Feitoria</button>
      <button id="btn-toggle-audio" class="btn btn-slate btn-sm">🔊 Áudio</button>
    </div>
  </header>

  <!-- CARTÃO DE MISSÃO ATIVA NO CANTO DA TELA -->
  <div id="quest-tracker">
    <div class="tracker-header">
      <span class="badge">MISSÃO ATIVA</span>
      <span id="quest-progress-tag" class="progress-tag">1/10</span>
    </div>
    <h3 id="active-quest-title">1. O Périplo Africano</h3>
    <p id="active-quest-desc">Navegue até o ponto indicado no mapa.</p>
  </div>

  <!-- BARRAS DE NAVEGAÇÃO DA COMUNIDADE -->
  <nav id="bottom-nav">
    <button id="btn-open-quests" class="btn btn-nav">📜 Missão</button>
    <button id="btn-open-library" class="btn btn-nav">📚 Biblioteca</button>
    <button id="btn-open-tools" class="btn btn-nav">✏️ Cartões</button>
    <button id="btn-open-simulado" class="btn btn-nav">✍️ Simulado</button>
  </nav>

  <!-- CONTROLES VIRTUAIS TÁTEIS (EXCLUSIVO PARA TELEMÓVEL) -->
  <div id="touch-controls">
    <button id="btn-touch-up" class="touch-btn">▲</button>
    <div class="touch-row">
      <button id="btn-touch-left" class="touch-btn">◀</button>
      <button id="btn-touch-down" class="touch-btn">▼</button>
      <button id="btn-touch-right" class="touch-btn">▶</button>
    </div>
  </div>

  <!-- MODAL DE DIÁLOGOS E JANELAS -->
  <div id="modal-overlay" class="overlay hidden">
    <div class="modal-card">
      <h2 id="modal-title" class="modal-header">Título do Modal</h2>
      <div id="modal-body" class="modal-content"></div>
      <footer id="modal-footer" class="modal-footer">
        <button class="btn btn-slate" onclick="window.closeModal()">Fechar</button>
      </footer>
    </div>
  </div>

  <!-- CANVAS DO MAPA DE NAVEGAÇÃO -->
  <canvas id="gameCanvas"></canvas>

  <script src="js.js"></script>
</body>
</html>
